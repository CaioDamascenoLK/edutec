<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/lemonmilk" rel="stylesheet">
    <title>Minigame</title>
    <link rel="stylesheet" href="page1.css">
    <script src="page1.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
        <a href="/frontend/index.html">
            <img src="/frontend/pages/img/logoMarcio.png" alt="logo MarcioBo">
          </a>
        </div>
        <nav>
            <ul>
                <li><a href="/frontend/pages/page4/page4.html">Sobre a Robótica</a></li>
                <li><a href="/frontend/pages/page3/page3.html">Arduíno</a></li>
                <li><a href="/frontend/pages/page2/page2.html">Material de Apoio</a></li>
                <li><a href="/frontend/pages/page5/page5.html">Resistores e Leds</a></li>
                <li><a href="/frontend/pages/page1/page1.html">Minigame</a></li>
                <li id="login-link"><a href="/frontend/pages/login/login.html"><img src="/frontend/pages/img/user.png" alt="Imagem para login"></a></li>
                <li id="user-info" style="display: none; align-items: center; gap: 15px;">
                    <span id="user-name" style="color: white; font-family: 'Lemon/Milk', sans-serif;"></span>
                    <a href="#" id="logout-button" style="color: white; text-decoration: underline; font-family: 'Lemon/Milk', sans-serif;">Logout</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="conteudo">
        <div class="robogame">
            <img src="/frontend/pages/img/roboMinigame.png" alt="roboMinigame">
        </div>

        <div class="minigame">
            <h1>MINIGAME</h1>
            <p>Jogue um pouco para testar suas habilidades!</p>
            <a href="/frontend/pages/page6/jogo.html" class="botao-jogar">Jogar!</a>
            <a href=""></a>
        </div>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');
            const loginLink = document.getElementById('login-link');
            const userInfo = document.getElementById('user-info');
            const userNameSpan = document.getElementById('user-name');
            const logoutButton = document.getElementById('logout-button');

            if (user) {
                if(loginLink) loginLink.style.display = 'none';
                if(userInfo) userInfo.style.display = 'flex';
                if(userNameSpan) userNameSpan.textContent = `Olá: ${user}`;

                if(logoutButton) logoutButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.reload();
                });
            } else {
                if(loginLink) loginLink.style.display = 'list-item';
                if(userInfo) userInfo.style.display = 'none';
            }
        });
    </script>
</body>
</html>
