<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/lemonmilk" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/tt-drugs-trial" rel="stylesheet">
    <title>Material de apoio</title>
    <link rel="stylesheet" href="page2.css">
    <script src="page2.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
        <a href="../../index.html">
            <img src="/frontend/pages/img/logoMarcio.png" alt="logo MarcioBo">
          </a>
        </div>
        <nav>
            <ul>
                <li><a href="/frontend/pages/page4/page4.html">Sobre a Robótica</a></li>
                <li><a href="/frontend/pages/page3/page3.html">Arduíno</a></li>
                <li><a href="/frontend/pages/page2/page2.html">Material de Apoio</a></li>
                <li><a href="/frontend/pages/page5/page5.html">Resistores e Leds</a></li>
                <li><a href="/frontend/pages/page1/page1.html">Minigame</a></li>
                <li id="login-link"><a href="../login/login.html"><img src="/frontend/pages/img/user.png" alt="Imagem para login"></a></li>
                <li id="user-info" style="display: none; align-items: center; gap: 15px;">
                    <span id="user-name" style="color: white; font-family: 'Lemon/Milk', sans-serif;"></span>
                    <a href="#" id="logout-button" style="color: white; text-decoration: underline; font-family: 'Lemon/Milk', sans-serif;">Logout</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="material">
      <h1>Material de apoio</h1>
      <img src="/frontend/pages/img/roboMaterial.png" alt="roboMaterial">
    </div>

    <div class="videos">
        <h2>Vídeos do Youtube</h2>
    
        <div class="videos-container">
            <div class="video-item">
                <a href="https://www.youtube.com/watch?v=84oVMHlGsRs&t=1s" target="_blank">
                    <img src="../img/dicas.png" alt="dicas">
                </a>
                <p>Dicas Para Aprender Robótica do Zero</p>
            </div>
    
            <div class="video-item">
                <a href="https://www.youtube.com/watch?v=Z6NI47_CxtM" target="_blank">
                    <img src="../img/oqueeh.png" alt="oque é">
                </a>
                <p>O que é Robótica Educacional?</p>
            </div>
    
            <div class="video-item">
                <a href="https://www.youtube.com/watch?v=1ShzOdT1RkA" target="_blank">
                    <img src="../img/aprenda.png" alt="aprenda">
                </a>
                <p>Aprenda a fazer um ROBÔ INCRÍVEL</p>
            </div>
    
            <div class="video-item">
                <a href="https://www.youtube.com/watch?v=AtxjRAuAyOs&t=1s" target="_blank">
                    <img src="../img/10dicas.png" alt="10dicas">
                </a>
                <p>10 Dicas de Robótica Para Iniciantes</p>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = localStorage.getItem('user');
            const loginLink = document.getElementById('login-link');
            const userInfo = document.getElementById('user-info');
            const userNameSpan = document.getElementById('user-name');
            const logoutButton = document.getElementById('logout-button');

            if (user) {
                // User is logged in
                if(loginLink) loginLink.style.display = 'none';
                if(userInfo) userInfo.style.display = 'flex';
                if(userNameSpan) userNameSpan.textContent = `Olá: ${user}`;

                if(logoutButton) logoutButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                    window.location.reload();
                });
            } else {
                // User is not logged in
                if(loginLink) loginLink.style.display = 'list-item';
                if(userInfo) userInfo.style.display = 'none';
            }
        });
    </script>
</body>
</html>
